[project]
name = "catppuccin-ida"
version = "0.1.0"
description = "Catppuccin theme and companion plugin for IDA 9.x"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    # IDA 9.3 bundles PySide6 6.8.0 (python/PySide6/__init__.py); keep in step.
    "pyside6-essentials==6.8.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.pyright]
include = ["src", "scripts"]
exclude = ["src/ida/old_chrome_icon_hack.py", "**/__pycache__"]
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
