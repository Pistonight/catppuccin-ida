# IDA toolbar/menu icons, rebuilt from codicons (@vscode/codicons).
#
# Each icon is a codicon `base` in a colour, optionally layered with a
# `modifier` badge in the bottom-right corner (src/icons/modifier-<name>.svg,
# extracted by scripts/extract-modifiers.py). Colours refer to config.yaml
# (c- colours or d- definitions).

# Modifiers always use the same color
modifiers:
  add: c-green  # add, create
  delete: c-red  # delete
  remove: c-peach  # shrink, change sign
  check: c-green  # toggles
  edit: c-peach  # edit
  warning: c-yellow  # conflicts
  sync: c-sky  # change
  down: c-sapphire  # save / export / search next
  up: c-sapphire  # load / import

# Mapped icons from the metadata
icons:
