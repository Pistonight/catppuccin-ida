# Remap action icons: action name -> the path of an icon in `icons` above, set on
# the action whatever icon IDA gives it (e.g. an action sharing a built-in
# icon with others). See src/ida/icon_meta.yaml for the action names.
actions:
  # CpuregsOpenRegDisasm: extra/window-disassembly.svg

# Dock window icons: window title -> the path of an icon in `icons` above,
# shown in its tab, header, title bar and Windows menu entry. IDA draws these
# from its own icon table, so the plugin sets them by title. A trailing *
# matches any suffix (IDA View-A).
windows:
  "IDA View*": resources/menu/WindowOpen.svg
  "Hex View*": resources/menu/ToggleDump.svg
  Exports: resources/menu/OpenExports.svg
  Imports: resources/menu/OpenImports.svg
  Names: resources/menu/OpenNames.svg
  Functions: resources/menu/OpenFunctions.svg
  Strings: resources/menu/OpenStrings.svg
  Segments: resources/menu/OpenSegments.svg
  Segment Registers: resources/menu/OpenSegmentRegisters.svg
  Signatures: resources/menu/OpenSignatures.svg
  Type Libraries: resources/menu/OpenTypeLibraries.svg
  Local Types: resources/menu/OpenLocalTypes.svg
  "Xref Graph*": resources/menu/OpenXrefs.svg
  Bookmarks: resources/menu/Bookmarks.svg
  Problems: resources/menu/OpenProblems.svg
  Patched bytes: resources/menu/PatchedBytes.svg
  Undo history: resources/menu/ShowUndoHistory.svg
  Output: resources/menu/OutputWindow.svg
  "Output window": resources/menu/OutputWindow.svg
  "Pseudocode*": resources/menu/Pseudocode.svg
  "Microcode*": extra/window-microcode.svg
